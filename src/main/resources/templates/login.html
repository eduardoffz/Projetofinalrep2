<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-name">AgriRent</div>
            <div class="brand-sub">Plataforma de Aluguel de Maquinas Agricolas</div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senha">Senha</label>
                <input type="password" class="form-control" name="senha" id="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-auth">Entrar</button>
        </form>

        <div class="auth-divider"><span>ou</span></div>

        <p class="auth-link">Nao tem conta? <a href="/cadastrar">Cadastre-se</a></p>
    </div>
</div>
</body>
</html>
