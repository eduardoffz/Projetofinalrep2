<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Explorar Maquinas')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <div class="page-header">
        <h1>Explorar Maquinas</h1>
        <p class="subtitle">Encontre a maquina ideal para sua propriedade</p>
    </div>

    <!-- Filtro -->
    <form method="get" action="/explorar" class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label small fw-medium text-muted" for="busca">Buscar</label>
                <input type="text" class="form-control form-control-sm" name="busca" id="busca" placeholder="Nome, fabricante, local..." th:value="${busca}">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-medium text-muted" for="tipo">Tipo</label>
                <select class="form-select form-select-sm" name="tipo" id="tipo">
                    <option value="">Todos os tipos</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${tipoSelecionado == t}"></option>
                </select>
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-success btn-sm">Filtrar</button>
                <a href="/explorar" class="btn btn-outline-secondary btn-sm">Limpar</a>
            </div>
        </div>
    </form>

    <!-- Filtro em tempo real -->
    <div class="filtro-realtime-bar mb-3">
        <label for="buscaTempoReal">Filtro Rapido:</label>
        <input type="text" id="buscaTempoReal" placeholder="Digite para filtrar sem recarregar..." oninput="filtrarMaquinasTempoReal()">
        <span id="contadorResultados"></span>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(maquinas)}" class="empty-state">
        <p class="mb-2">Nenhuma maquina encontrada.</p>
        <a href="/explorar" class="btn btn-outline-success btn-sm">Limpar Filtros</a>
    </div>

    <div id="semResultadoFiltro" class="empty-state d-none mt-3">
        <p class="mb-0">Nenhuma maquina encontrada com esse termo.</p>
    </div>

    <!-- Grid de maquinas -->
    <div class="row g-3" th:unless="${#lists.isEmpty(maquinas)}">
        <div class="col-md-6 col-lg-4"
             th:each="m : ${maquinas}"
             th:attr="data-busca=${#strings.toLowerCase(m.nome + ' ' + m.fabricante + ' ' + m.tipo + ' ' + (m.localizacao ?: ''))}"
             th:classappend="'machine-card'">
            <div class="card card-agri h-100">
                <div class="machine-img-placeholder">
                    <span th:text="${m.tipo}">TIPO</span>
                </div>
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <h6 class="card-title fw-bold mb-0" th:text="${m.nome}">Maquina</h6>
                        <span class="badge-status disponivel" th:if="${m.disponivel}">Disponivel</span>
                    </div>
                    <p class="card-text small text-muted mb-1">
                        <span th:text="${m.fabricante + ' ' + m.modelo}">Fabricante Modelo</span>
                    </p>
                    <p class="card-text small text-muted mb-1">
                        <span th:text="${m.tipo}">Tipo</span>
                        &middot; <span th:text="${m.anoFabricacao}">Ano</span>
                        &middot; <span th:text="${#numbers.formatDecimal(m.horasUsoTotais,0,1)}">0</span>h
                    </p>
                    <p class="card-text small text-muted mb-2" th:if="${m.localizacao}" th:text="${m.localizacao}">Local</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-success fs-5">
                            R$<span th:text="${#numbers.formatDecimal(m.precoDiaria,0,2)}">0</span>
                            <small class="fw-normal text-muted fs-sm">/dia</small>
                        </span>
                        <a th:href="@{/maquinas/{id}(id=${m.id})}" class="btn btn-success btn-sm">Alugar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
