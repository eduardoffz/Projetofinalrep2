<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Servicos Adicionais')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <div class="page-header">
        <h1>Servicos Adicionais</h1>
        <p class="subtitle">Gerencie os servicos disponiveis para locacao</p>
    </div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${#lists.isEmpty(servicos)}" class="empty-state">
        <p class="mb-0">Nenhum servico cadastrado.</p>
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(servicos)}">
        <div class="col-md-6 col-lg-4" th:each="s : ${servicos}">
            <div class="card card-agri h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0" th:text="${s.nome}">Nome</h6>
                        <span class="badge bg-secondary bg-opacity-10 text-secondary fw-medium" th:text="${s.tipo}">TIPO</span>
                    </div>
                    <p class="small text-muted mb-2" th:text="${s.descricao}">Descricao</p>
                    <span class="fw-bold text-success">R$ <span th:text="${#numbers.formatDecimal(s.preco,0,2)}">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/" class="btn btn-outline-secondary btn-sm">&larr; Voltar ao Dashboard</a>
    </div>
</main>
</body>
</html>
